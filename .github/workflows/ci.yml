name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Testes (sem chaves de API, modelos roteirizados)
        run: pytest
      - name: Fumaça do CLI (ingestão offline)
        env:
          EMBEDDING_MODEL: offline:hashing
          CHROMA_DIR: /tmp/chroma-ci
        run: |
          ragagents ingest
          ragagents graph > /dev/null
